[package]
name = "pgbo"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { version = "*", features = ["full"] }
rocket = { version = "0.5.1", features = ["json"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
rust_decimal = "1.36"